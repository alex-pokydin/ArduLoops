name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to upload installers to
        required: true
        default: "2.2.4"
      only:
        description: Run one job (linux, windows, macos, android). Empty runs all.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-22.04
    outputs:
      release-id: ${{ steps.ensure.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure GitHub release
        id: ensure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          title="ArduLoops ${tag}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file .release-notes.md
          else
            gh release create "$tag" --title "$title" --notes-file .release-notes.md
          fi
          id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  linux:
    needs: github-release
    if: github.event_name != 'workflow_dispatch' || inputs.only == '' || inputs.only == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2 xdg-utils pkg-config libudev-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.github-release.outputs.release-id }}
          uploadUpdaterJson: false
          tauriScript: node scripts/with-cargo.mjs tauri
          args: --bundles deb,rpm,appimage

  windows:
    needs: github-release
    if: github.event_name != 'workflow_dispatch' || inputs.only == '' || inputs.only == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.github-release.outputs.release-id }}
          uploadUpdaterJson: false
          tauriScript: node scripts/with-cargo.mjs tauri
          args: --bundles nsis,msi

  macos:
    needs: github-release
    if: github.event_name != 'workflow_dispatch' || inputs.only == '' || inputs.only == 'macos'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - name: Build macOS SITL
        run: bash scripts/build-sitl-macos.sh ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.github-release.outputs.release-id }}
          uploadUpdaterJson: false
          tauriScript: node scripts/with-cargo.mjs tauri
          args: --target ${{ matrix.target }} --bundles dmg --no-sign

  android:
    needs: github-release
    if: github.event_name != 'workflow_dispatch' || inputs.only == '' || inputs.only == 'android'
    permissions:
      contents: write
    uses: ./.github/workflows/android.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit
