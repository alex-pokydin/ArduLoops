name: Android

permissions:
  contents: write

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        required: false
        type: string

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Android project
        run: |
          npm run tauri -- android init --ci
          # Release builds default to no cleartext. The UI talks to the on-device backend at http://127.0.0.1:8767.
          gradle=src-tauri/gen/android/app/build.gradle.kts
          grep -q 'usesCleartextTraffic"\] = "false"' "$gradle"
          sed -i 's/usesCleartextTraffic"\] = "false"/usesCleartextTraffic"] = "true"/' "$gradle"
          grep -q 'usesCleartextTraffic"\] = "false"' "$gradle" && exit 1
          grep -q 'usesCleartextTraffic"\] = "true"' "$gradle"
      - name: Version
        # The version lives in Cargo.toml only. Desktop builds read it from there; the Android build does
        # not, and without it the APK is versionName 1.0 / versionCode 1, which cannot update an installed app.
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$(echo "$version" | awk -F. '{ print $1 * 1000000 + $2 * 1000 + $3 }')" >> "$GITHUB_ENV"
      - name: APK
        run: npm run tauri -- android build --apk --target aarch64 --ci --config "{\"version\":\"$APP_VERSION\"}"
      - name: Sign APK
        run: |
          mkdir -p dist-apk
          unsigned=$(find src-tauri/gen/android -name '*.apk' -print -quit)
          aligned="$RUNNER_TEMP/arduloops-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$unsigned" "$aligned"
          out="dist-apk/ArduLoops_${APP_VERSION}_aarch64.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks src-tauri/arduloops-sideload.p12 \
            --ks-pass pass:arduloops \
            --key-pass pass:arduloops \
            --out "$out" \
            "$aligned"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$out"
          # An APK whose versionCode is not this release's cannot update the installed app.
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$out" | head -1)
          echo "$badging"
          echo "$badging" | grep -q "versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION'" || { echo "APK version is not $APP_VERSION ($APP_VERSION_CODE)"; exit 1; }
          ls -l dist-apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-apk/*.apk
      - name: Upload to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist-apk/*.apk --clobber
