[package]
name = "arduloops"
version = "2.0.0"
description = "ArduLoops"
authors = ["IAMPM"]
edition = "2021"
rust-version = "1.85"
default-run = "arduloops"

[lib]
name = "arduloops_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "arduloops-bridge"
path = "src/bin/bridge.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-log", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2.6.3", optional = true , features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", optional = true , features = [] }
tauri-plugin-log = { version = "2", optional = true }
# direct-serial pulls the `serial` crate, whose termios 0.2 dependency does not build for Android.
mavlink = { version = "0.13.1", default-features = false, features = ["std", "tcp", "udp", "serde", "ardupilotmega"] }
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
base64 = "0.22"
flate2 = "1.0"
sha2 = "0.10"
tar = "0.4"
uuid = { version = "1.11", features = ["v4"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
# Model HTTPS uses rustls with ring. OpenSSL and aws-lc do not cross-compile into the Android app.
genai = { version = "0.6.5", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "net", "io-util", "sync"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
mavlink = { version = "0.13.1", default-features = false, features = ["direct-serial"] }
serialport = "4.7.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_NetworkManagement_IpHelper", "Win32_System_Registry"] }
