[package]
name = "arduloops"
version = "1.4.0"
description = "ArduLoops"
authors = ["IAMPM"]
edition = "2021"
rust-version = "1.77.2"
default-run = "arduloops"

[lib]
name = "arduloops_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "arduloops-bridge"
path = "src/bin/bridge.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-log", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2.6.3", optional = true , features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", optional = true , features = [] }
tauri-plugin-log = { version = "2", optional = true }
# direct-serial pulls the `serial` crate, whose termios 0.2 dependency does not build for Android.
mavlink = { version = "0.13.1", default-features = false, features = ["std", "tcp", "udp", "serde", "ardupilotmega"] }
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
mavlink = { version = "0.13.1", default-features = false, features = ["direct-serial"] }
serialport = "4.7.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Registry"] }
